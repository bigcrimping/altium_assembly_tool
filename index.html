<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altium Assembly Tool</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    svg .silkscreen-element { display: none; }
    body.show-silkscreen svg .silkscreen-element { display: inline !important; stroke: #f0c040; opacity: 0.75; }
  </style>
</head>
<body>

<div id="toolbar">
  <div class="tb-group">
    <button class="btn" id="btn-open">Open PCB</button>
    <span class="board-name" id="board-name">No file loaded</span>
  </div>
  <div class="tb-group">
    <button class="btn" id="btn-prev" disabled>&#9668; Prev</button>
    <button class="btn" id="btn-next" disabled>Next &#9658;</button>
    <span class="step-label" id="step-label"></span>
  </div>
  <div class="tb-group">
    <button class="btn" id="btn-fit" disabled>Fit View</button>
    <button class="btn" id="btn-fit-sel" disabled title="Zoom to the selected BOM row's components">Fit Selection</button>
    <button class="btn" id="btn-auto-zoom" disabled title="Automatically zoom to each BOM row as you step through">Auto Zoom</button>
    <button class="btn" id="btn-labels" disabled title="Show designator labels on the selected row's components">Labels</button>
    <button class="btn" id="btn-silkscreen" disabled title="Show/hide silkscreen layer outlines and text overlay">Silkscreen</button>
    <button class="btn" id="btn-clear" disabled>Clear Selection</button>
    <button class="btn" id="btn-dnp" disabled title="Highlight every part marked Do Not Fit (DNP) across the board — a quick check of parts that should not be fitted">Show DNP</button>
  </div>
  <div class="tb-group">
    <select id="variant-select" class="btn" disabled title="Select PCB assembly variant"></select>
  </div>
  <div class="tb-group">
    <button class="btn active-side" id="btn-top" disabled>Top Side</button>
    <button class="btn" id="btn-bot" disabled>Bottom Side</button>
  </div>
  <div class="tb-group">
    <span class="step-label" id="progress-label"></span>
  </div>
</div>

<!-- Load dialog overlay -->
<div id="load-overlay" class="hidden">
  <div class="load-form">
    <h2>Open PCB File</h2>
    <div class="form-group">
      <label for="pcb-path">Altium PCB File Path (.PcbDoc)</label>
      <input type="text" id="pcb-path" placeholder="C:\path\to\board.PcbDoc" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="prj-path">Altium Project File Path (.PrjPcb &mdash; optional for DNP/variants)</label>
      <input type="text" id="prj-path" placeholder="C:\path\to\project.PrjPcb" autocomplete="off">
    </div>
    <div id="recent-list" class="recent-list hidden"></div>
    <div id="load-error" class="load-error hidden"></div>
    <div class="form-actions">
      <button class="btn primary" id="btn-load-file">Load PCB</button>
      <button class="btn" id="btn-cancel-load">Cancel</button>
    </div>
  </div>
</div>

<div id="main-layout">
  <div id="board-panel">
    <div id="board-container">
      <div id="board-transform"></div>
    </div>
  </div>
  <div id="resizer"></div>
  <div id="bom-panel">
    <div class="bom-header">
      <span>Bill of Materials</span>
      <button class="btn" id="btn-hide-fitted" disabled title="Hide BOM rows where every part is already placed (or marked DNP)">Hide Fitted</button>
      <input type="text" id="bom-search" placeholder="Filter by designator, name, or serial number&hellip;" autocomplete="off" disabled>
      <button class="btn active-side" id="btn-search-sn" disabled title="When enabled, search includes Serial/Part Numbers. Disable for exact Value searching (e.g. 1R).">Include SN</button>
      <button class="btn active-side" id="btn-search-refs" disabled title="When enabled, search includes component designators (R1, C3, U5…). Disable to search only by component value/name.">Include Refs</button>
    </div>
    <div id="bom-scroll">
      <table id="bom-table">
        <thead>
          <tr>
            <th>#</th>
            <th>QTY</th>
            <th>Placed</th>
            <th>To Place</th>
            <th>Name</th>
            <th>Serial Number</th>
            <th>Top Refs</th>
            <th>Bottom Refs</th>
          </tr>
        </thead>
        <tbody id="bom-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="statusbar">Ready.</div>

<script src="/static/app.js"></script>
</body>
</html>
